<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KITZ 실시간 현황</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1a1d21;--muted:#6b7280;--line:#e5e7eb;--accent:#e11d48;--up:#059669;--down:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--text:#e8eaed;--muted:#9aa0a6;--line:#2a2e36;--accent:#fb7185;--up:#34d399;--down:#f87171}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 "Pretendard","Malgun Gothic",system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:24px 16px 48px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:20px}
h1{font-size:22px;margin:0}
.meta{color:var(--muted);font-size:13px}
.meta b{color:var(--text)}
.stale{color:var(--down);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card .label{color:var(--muted);font-size:13px}
.card .value{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.card .diff{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.diff .up{color:var(--up)} .diff .down{color:var(--down)}
h2{font-size:16px;margin:0 0 10px}
.table-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:28px}
table{border-collapse:collapse;width:100%;min-width:640px;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600}
th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:0}
tr.today td{font-weight:700}
.note{color:var(--muted);font-size:12px}
.lag{color:var(--muted);font-size:13px;font-weight:500}
</style>
</head>
<body>
<main>
  <noscript>이 페이지는 자바스크립트가 필요합니다.</noscript>
  <header>
    <h1>KITZ 실시간 현황</h1>
    <div class="meta">마지막 확인 <b id="updated">-</b> · 5분마다 자동 갱신</div>
  </header>
  <section class="cards" id="cards"></section>
  <h2>최근 7일</h2>
  <div class="table-wrap"><table id="daily"></table></div>
  <h2>오늘 채널별</h2>
  <div class="table-wrap"><table id="channel"></table></div>
  <p class="note">출처: 에어브릿지 KITZ 앱 액츄얼스 리포트(Event Date 기준, KST). 오늘 수치는 진행 중이며 어제 대비는 어제 하루 전체와 비교합니다. 매출 통화는 에어브릿지 앱 설정 통화 기준입니다. 5분마다 에어브릿지를 확인하지만, 에어브릿지가 집계를 일정 간격으로 반영하기 때문에 숫자는 그보다 드물게 바뀝니다. 접속·결제·재생 유저 수는 에어브릿지가 시간 단위로 뒤늦게 집계해 자정 직후 등에는 '집계 중'으로 표시됩니다.</p>
</main>
<script>
const COLS=[
  ['app_installs','설치'],['app_open_users','접속 유저'],['app_paying_users','결제 유저'],
  ['app_total_revenue','매출'],['app_custom_episode_play','에피소드 재생'],
  ['app_custom_users_episode_play','재생 유저'],['app_custom_episode_complete','에피소드 완료']];
const fmt=v=>Math.round(v||0).toLocaleString('ko-KR');
// 유저 수 지표는 에어브릿지가 시간 단위로 뒤늦게 집계한다 → 오늘 값이 아직 0이면 '집계 중'으로 표시
const LAGGED=['app_open_users','app_paying_users','app_custom_users_episode_play'];
const cell=(row,k,isToday)=>(isToday&&LAGGED.includes(k)&&!(row[k]>0)&&row.app_installs>0)?'<span class="lag">집계 중</span>':fmt(row[k]);
function render(d){
  const upd=document.getElementById('updated');
  upd.textContent=d.updatedAt;
  const age=(Date.now()-new Date(d.updatedAt.replace(' ','T')+':00+09:00'))/60000;
  upd.className=age>20?'stale':'';
  if(age>20) upd.textContent+=' (수집 지연)';
  const t=d.daily.find(r=>r.key===d.today)||{}, y=d.daily.find(r=>r.key<d.today)||{};
  document.getElementById('cards').innerHTML=COLS.map(([k,n])=>{
    const diff=(t[k]||0)-(y[k]||0), cls=diff>=0?'up':'down';
    return `<div class="card"><div class="label">오늘 ${n}</div><div class="value">${cell(t,k,true)}</div>
      <div class="diff">어제 ${fmt(y[k])} · <span class="${cls}">${diff>=0?'+':''}${fmt(diff)}</span></div></div>`}).join('');
  const head=first=>`<tr><th>${first}</th>${COLS.map(c=>`<th>${c[1]}</th>`).join('')}</tr>`;
  document.getElementById('daily').innerHTML=head('날짜')+d.daily.map(r=>
    `<tr class="${r.key===d.today?'today':''}"><td>${r.key}${r.key===d.today?' (오늘)':''}</td>${COLS.map(c=>`<td>${cell(r,c[0],r.key===d.today)}</td>`).join('')}</tr>`).join('');
  document.getElementById('channel').innerHTML=head('채널')+(d.channel.length?d.channel.map(r=>
    `<tr><td>${r.key}</td>${COLS.map(c=>`<td>${cell(r,c[0],true)}</td>`).join('')}</tr>`).join(''):'<tr><td colspan="8">데이터 없음</td></tr>');
}
const API_URL='https://api.github.com/repos/ahnhm9-cloud/kitz-live/contents/data.json?ref=data';
const RAW_URL='https://raw.githubusercontent.com/ahnhm9-cloud/kitz-live/data/data.json';
function getJSON(url,opts){return fetch(url,opts).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()})}
function load(){
  // GitHub API는 캐시 없이 최신본을 준다. 호출 한도(IP당 시간 60회)를 넘으면 raw(최대 5분 지연)로 대체
  getJSON(API_URL+'&t='+Date.now(),{cache:'no-store',headers:{Accept:'application/vnd.github.raw'}})
    .catch(()=>getJSON(RAW_URL+'?t='+Date.now(),{cache:'no-store'}))
    .then(render)
    .catch(()=>{document.getElementById('updated').textContent='데이터를 불러오지 못함'});
}
// 수집기는 매 x2·x7분에 올린다 → 그 40초 뒤에 맞춰 읽는다
function nextDelay(){
  const now=new Date(), t=new Date(now);
  t.setSeconds(40,0);
  while(t<=now || (t.getMinutes()%5)!==2) t.setMinutes(t.getMinutes()+1,40,0);
  return t-now;
}
function schedule(){setTimeout(()=>{load();schedule()},nextDelay())}
load();
schedule();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')load()});
</script>
</body>
</html>
